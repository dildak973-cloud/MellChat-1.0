<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mell chat</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
:root{--bg:#000;--p:#0c0c0e;--p2:#161618;--l:#26262a;--t:#f2f2f2;--m:#8b8b93;--a:#2f8fff;--own:#1f5fbf;--g:linear-gradient(135deg,#ffd76a,#ff8f3a,#ff4fa3)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--t);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
input,textarea{background:var(--p2);border:1px solid var(--l);border-radius:12px;padding:10px 12px;width:100%;outline:0}input:focus,textarea:focus{border-color:var(--a)}
.btn{background:var(--a);border-radius:12px;padding:10px 16px;font-weight:600}.btn.g{background:var(--g);color:#111}.btn.s{background:var(--p2)}
.hide{display:none!important}
/* auth */
#auth{height:100%;display:grid;place-items:center;padding:16px}
.card{width:min(380px,100%);background:var(--p);border:1px solid var(--l);border-radius:20px;padding:26px;display:grid;gap:12px;text-align:center}
.logo{width:92px;height:70px;margin:0 auto;border:2px solid #ddd;border-radius:26px 26px 26px 6px;display:flex;gap:7px;align-items:center;justify-content:center;box-shadow:0 0 24px #fff3,inset 0 0 12px #fff2}
.logo i{width:12px;height:12px;border-radius:50%;background:#eee}
.mail{background:#10261a;border:1px solid #1f6b3c;border-radius:12px;padding:10px;font-size:13px;text-align:left}
.sm{color:var(--m);font-size:12px}
/* app */
#app{height:100%;display:grid;grid-template-columns:340px 1fr}
#side{background:var(--p);border-right:1px solid var(--l);display:flex;flex-direction:column;min-height:0}
.top{display:flex;gap:8px;padding:10px;align-items:center}
#list{overflow:auto;flex:1}
.row{display:flex;gap:10px;padding:9px 12px;align-items:center;cursor:pointer;border-radius:12px;margin:0 6px}
.row:hover,.row.on{background:var(--p2)}.row .in{min-width:0;flex:1}.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lm{color:var(--m);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(circle at 70% 20%,#111 0,#000 70%)}
#head{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--p);border-bottom:1px solid var(--l)}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:4px}
.m{max-width:min(78%,520px);align-self:flex-start;background:var(--p2);border-radius:16px 16px 16px 4px;padding:7px 11px;position:relative}
.m.me{align-self:flex-end;background:var(--own);border-radius:16px 16px 4px 16px}
.m .who{font-size:13px;font-weight:600;cursor:pointer}.m .tx{white-space:pre-wrap;word-break:break-word}
.m .tm{font-size:11px;color:#ffffff90;text-align:right;margin-top:1px}
.rp{border-left:3px solid var(--a);padding:1px 8px;margin-bottom:4px;font-size:13px;color:#ddd;background:#0003;border-radius:4px}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.rx span{background:#0005;border-radius:10px;padding:1px 7px;font-size:13px;cursor:pointer}
.act{position:absolute;top:-14px;right:6px;display:none;background:var(--p);border:1px solid var(--l);border-radius:10px;padding:1px 4px;gap:2px;z-index:2}
.m:hover .act,.m:focus-within .act{display:flex}.act button{padding:2px 5px;font-size:14px}
#bar{padding:10px;background:var(--p);border-top:1px solid var(--l)}
#ctx{font-size:13px;color:var(--a);padding:0 6px 6px;display:flex;justify-content:space-between}
.cmp{display:flex;gap:8px;align-items:flex-end}.cmp textarea{resize:none;max-height:120px;border-radius:20px}
#emo{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--p2);border-radius:12px;padding:6px;margin-bottom:8px}
#emo button{font-size:20px;padding:3px}
/* avatars & frames */
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;display:inline-grid;place-items:center;isolation:isolate;background:linear-gradient(135deg,#3a3a46,#1a1a22);vertical-align:middle}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}.av b{font-size:calc(var(--s)*.42)}
.f-gold{box-shadow:0 0 0 2px #000,0 0 0 4px #ffc93c}
.f-neon{box-shadow:0 0 0 2px #000,0 0 0 4px #20f0ff,0 0 14px #20f0ff}
.f-rose{box-shadow:0 0 0 2px #000,0 0 0 4px #ff4fa3,0 0 14px #ff4fa388}
.f-rainbow::before,.f-fire::before{content:"";position:absolute;inset:-5px;border-radius:50%;z-index:-1;background:conic-gradient(#f33,#fa0,#ff0,#3f6,#0cf,#93f,#f33);animation:rot 3s linear infinite;-webkit-mask:radial-gradient(circle,transparent calc(50% - 1px),#000 calc(50% - 0px));mask:radial-gradient(circle,transparent calc(50% - 1px),#000 calc(50% - 0px))}
.f-rainbow::after,.f-fire::after{content:"";position:absolute;inset:-3px;border-radius:50%;z-index:-1;background:#000}
.f-fire::before{background:conic-gradient(#ff2a00,#ffb300,#ff2a00,#ffb300,#ff2a00);animation-duration:1.2s}
@keyframes rot{to{transform:rotate(1turn)}}
.pb{display:inline-block;background:var(--g);color:#111;font-size:10px;font-weight:800;border-radius:6px;padding:0 4px;margin-left:4px;vertical-align:middle}
.stt{display:inline-block;margin-left:3px;font-size:1.05em}.stt img{height:1.3em;vertical-align:middle}
.an-bounce{animation:bn 1s infinite}.an-spin{animation:rot 2s linear infinite}.an-pulse{animation:pl 1.2s infinite}.an-shake{animation:sh .6s infinite}
@keyframes bn{50%{transform:translateY(-3px)}}@keyframes pl{50%{transform:scale(1.3)}}@keyframes sh{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
/* modal */
#mod{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:12px;z-index:9}
.box{width:min(440px,100%);max-height:92%;overflow:auto;background:var(--p);border:1px solid var(--l);border-radius:20px;display:grid;gap:10px;padding:0 0 16px}
.box>*:not(.ban){margin:0 16px}.ban{height:120px;background:linear-gradient(135deg,#1b2a4a,#3a1b4a);background-size:cover;background-position:center;border-radius:20px 20px 0 0;position:relative}
.ban .av{position:absolute;left:16px;bottom:-30px}.pad{height:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:5px 9px}.chips button.on{border-color:var(--a)}
.lock{opacity:.5;pointer-events:none}.lbl{font-size:12px;color:var(--m);margin-top:4px}
@media(max-width:720px){#app{grid-template-columns:1fr}#main{display:none}#app.chat #side{display:none}#app.chat #main{display:flex}.m{max-width:88%}}
/* GLASS */
body{background:#030308}body::before,body::after{content:'';position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.55;z-index:-1;animation:orb 18s ease-in-out infinite alternate}
body::before{background:radial-gradient(circle,#5b3bff,#0ff0 70%);top:-20vmax;left:-15vmax}body::after{background:radial-gradient(circle,#ff3ba7,#ffb80000 70%);bottom:-25vmax;right:-15vmax;animation-delay:-9s}
@keyframes orb{to{transform:translate(12vmax,8vmax) scale(1.2)}}
:root{--p:rgba(255,255,255,.06);--p2:rgba(255,255,255,.09);--l:rgba(255,255,255,.16)}
#side,#head,#bar,.card,.box,.gc{background:rgba(14,14,26,.45)!important;-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 0 #fff3,0 8px 32px #0008}
#main{background:none}#mod{backdrop-filter:blur(8px)}
.card,.box,.gc{border:1px solid transparent!important;background:linear-gradient(rgba(14,14,26,.6),rgba(14,14,26,.6)) padding-box,linear-gradient(120deg,#7ff,#b8f,#f8c,#ff9,#7ff) border-box!important;background-size:auto,300% 100%!important;animation:shim 8s linear infinite}
@keyframes shim{to{background-position:0 0,300% 0}}
.m{background:linear-gradient(rgba(20,20,36,.62),rgba(20,20,36,.62)) padding-box,linear-gradient(120deg,#6ff8,#c9f8,#f9c8,#ff98,#6ff8) border-box;background-size:auto,300% 100%;border:1px solid transparent;animation:shim 9s linear infinite;backdrop-filter:blur(10px)}
.m.me{background:linear-gradient(135deg,rgba(60,110,255,.7),rgba(170,70,255,.65)) padding-box,linear-gradient(120deg,#fff9,#6ff9,#f9f9,#fff9) border-box;background-size:auto,300% 100%}
.m.stk{background:none!important;border:0;backdrop-filter:none;animation:none}.m.stk .tx{font-size:1em}
.row:hover,.row.on{background:linear-gradient(90deg,#7f7fff33,#f7f7ff1a)}
.btn{background:linear-gradient(135deg,#4f8cff,#a35bff);box-shadow:inset 0 1px 0 #fff6,0 4px 16px #6a5cff55}.btn.s{background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 #fff3}
input,textarea{background:rgba(255,255,255,.07);backdrop-filter:blur(8px)}
.logo{animation:shim 6s linear infinite}
.vf{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#2f8fff;color:#fff;font-size:10px;margin-left:4px;vertical-align:middle;box-shadow:0 0 8px #2f8fff}
.big{font-size:84px;line-height:1.1;display:inline-block}.sk{width:150px;max-width:100%}.ce{height:1.4em;vertical-align:middle}
.an-float{animation:fl 2.4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px) rotate(6deg)}}
#stp{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px;margin-bottom:8px;max-height:200px;overflow:auto}#stp button{font-size:32px;padding:2px}#stp img{width:100%}
.gc{border-radius:18px;padding:14px;margin-bottom:12px;display:grid;gap:8px}.gr{display:flex;flex-wrap:wrap;gap:10px}.gi{position:relative;text-align:center}.gi button{position:absolute;top:-4px;right:-4px;background:#000a;border-radius:50%;width:20px;height:20px}
/* ANIM */
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}}
@keyframes aur{50%{background-position:100% 50%}}
.m{animation:pop .35s ease-out,shim 9s linear infinite}
#main{background:linear-gradient(120deg,#3b2bff1f,#ff3ba71a,#00e5ff1a,#3b2bff1f);background-size:300% 300%;animation:aur 14s ease infinite}
#main[data-wp=sunset]{background:linear-gradient(160deg,#ff5e3a40,#ff2d8a30,#5b2bff40,#ff5e3a40);background-size:300% 300%}
#main[data-wp=ocean]{background:linear-gradient(160deg,#00c6ff35,#0050ff30,#00ffc835,#00c6ff35);background-size:300% 300%}
#main[data-wp=grid]{background:repeating-linear-gradient(0deg,#0ff1 0 1px,#0000 1px 34px),repeating-linear-gradient(90deg,#f0f1 0 1px,#0000 1px 34px),#050510;animation:grid 3s linear infinite}
@keyframes grid{to{background-position:0 34px,34px 0}}
.btn{transition:.2s}.btn:hover{transform:translateY(-1px) scale(1.04);filter:brightness(1.2)}.row{transition:.2s}.row:hover{transform:translateX(3px)}
h2,.top input::placeholder{background:linear-gradient(90deg,#7ff,#c9f,#f9c,#7ff);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite}
.av{transition:.3s}.av:hover{transform:scale(1.08) rotate(-3deg)}
/* MONO */
html{filter:grayscale(1) contrast(1.08)}
body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:#000}
body::before,body::after{background:radial-gradient(circle,#fff,#0000 70%);opacity:.2}
#app::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,#fff1 0 1px,#0000 1px 3px);animation:scan 6s linear infinite}
@keyframes scan{to{background-position:0 60px}}
.btn,.btn.g{background:#fff;color:#000;box-shadow:0 0 18px #fff4}.btn.s{background:#ffffff14;color:#fff;border:1px solid #fff3;box-shadow:none}
.card,.box,.gc,.m{background:linear-gradient(rgba(8,8,8,.7),rgba(8,8,8,.7)) padding-box,linear-gradient(120deg,#fff,#444,#fff,#444) border-box!important;background-size:auto,300% 100%!important}
.m.me{background:linear-gradient(135deg,#fff,#aaa) padding-box,linear-gradient(120deg,#fff,#555,#fff) border-box!important;background-size:auto,300% 100%!important;color:#000}.m.me .tm,.m.me .rp{color:#000a}
.m.stk{background:none!important}.pb,.vf{background:#fff;color:#000;box-shadow:0 0 8px #fff}
</style></head><body>
<div id="auth"><div class="card" id="ac"></div></div>
<div id="app" class="hide">
 <aside id="side"><div class="top"><button class="btn s" data-a="me" title="Профиль">☰</button><button class="btn s" data-a="nch" title="Создать группу или канал">＋</button><input id="q" placeholder="Поиск @username"></div><div id="list"></div></aside>
 <section id="main"><div id="head"></div><div id="msgs"></div>
  <div id="bar"><div id="emo" class="hide"></div><div id="stp" class="hide"></div><div id="ctx" class="hide"></div>
   <div class="cmp"><button data-a="emo" class="btn s">😊</button><button data-a="stk" class="btn s">🎭</button><textarea id="in" rows="1" placeholder="Сообщение"></textarea><button class="btn" data-a="send">➤</button></div></div></section>
</div>
<div id="mod" class="hide"></div><input type="file" id="fk" accept="image/*" class="hide"><input type="file" id="fk2" accept="image/*" class="hide">
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=u=>typeof u==='string'&&u.startsWith('data:image/')?u:'';
const EM='😀 😂 😍 😎 🥹 😭 😡 🤔 👍 👎 🔥 ❤️ 💜 🎉 🙏 👀 💯 ✨ 🚀 😴 🤝 💀 🫡 🥳 ☕ 🌙 ⚡ 🍀 👑 💎'.split(' ');
const FR=[['','Нет'],['gold','Золото'],['neon','Неон'],['rose','Роза'],['rainbow','Радуга'],['fire','Огонь']];
const AN=[['','Без анимации'],['bounce','Прыжок'],['spin','Вращение'],['pulse','Пульс'],['shake','Тряска']];
const NC=['','#ff6b6b','#ffd76a','#5eead4','#60a5fa','#c084fc','#f472b6','gold'];
let DB=null,uid='local',U={},M=[],chat='general',reply=null,edit=null,code=null,email='',draft={},mine=null;
/* ---- data layer (db if available, else in-memory demo) ---- */
const mem={};function memC(n){const m=mem[n]||(mem[n]=new Map()),ls=[];
 const em=()=>ls.forEach(f=>f({docs:[...m].map(([id,d])=>({id,data:()=>d}))}));
 return{onSnapshot:f=>{ls.push(f);em()},doc:id=>({set:async d=>{m.set(id,d);em()},update:async d=>{m.set(id,{...m.get(id),...d});em()},delete:async()=>{m.delete(id);em()}})}}
const col=n=>DB?DB.collection(n):memC(n);
const sub=(n,cb)=>col(n).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))));
const put=(n,id,d)=>col(n).doc(id).set(d).catch(e=>toast('Ошибка: '+(e.message||e.code)));
const upd=(n,id,d)=>col(n).doc(id).update(d).catch(e=>toast('Ошибка: '+(e.message||e.code)));
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;border-radius:12px;padding:8px 14px;z-index:99';document.body.append(d);setTimeout(()=>d.remove(),3000)}
/* ---- ui helpers ---- */
const av=(u,s=44)=>`<span class="av ${u?.plus&&u.frame?'f-'+esc(u.frame):''}" style="--s:${s}px">${img(u?.av)?`<img src="${img(u.av)}" alt="">`:`<b>${esc((u?.name||'?')[0].toUpperCase())}</b>`}</span>`;
const nm=u=>{if(!u)return'Удалён';let c=u.plus&&u.nc?(u.nc==='gold'?'background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent':'color:'+esc(u.nc)):'';
 let st=u.plus?(img(u.stImg)?`<span class="stt"><img src="${img(u.stImg)}"></span>`:u.st?`<span class="stt an-${esc(u.stA||'')}">${esc(u.st)}</span>`:''):'';
 return`<span style="${c}">${esc(u.name)}</span>${st}${u.plus?'<span class="pb">D+</span>':''}${u.bot?'<span class="vf">✓</span>':''}`};
const cid=(a,b)=>[a,b].sort().join('_');
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function chats(){const o={};M.forEach(m=>{if(m.c==='general'||m.c.split('_').includes(uid))o[m.c]=m});o.general=o.general||{t:0};o[cid(uid,'stickers')]=o[cid(uid,'stickers')]||{t:1};Ch.filter(x=>(x.mem||[]).includes(uid)).forEach(x=>o[x.id]=M.filter(m=>m.c===x.id).pop()||{t:x.t});if(chat!=='general'&&!o[chat])o[chat]={t:Date.now()};
 return Object.entries(o).sort((a,b)=>(a[0]==='general'?1e15:a[1].t)>(b[0]==='general'?1e15:b[1].t)?-1:1)}
const peer=c=>U[c.split('_').find(x=>x!==uid)||uid];
/* ---- auth ---- */
function auth(step){const c=$('#ac');
 if(step===0)c.innerHTML=`<div class="logo"><i></i><i></i><i></i></div><h2>Mell chat</h2><p class="sm">Войдите по почте — мы отправим код</p><input id="em" type="email" placeholder="you@mail.com"><button class="btn" data-a="code">Получить код</button>`;
 if(step===1)c.innerHTML=`<h3>Введите код</h3><div class="mail">📧 <b>Письмо от Mell</b><br>Ваш код входа: <b style="font-size:18px;letter-spacing:3px">${code}</b><br><span class="sm">Демо: настоящую почту отправить нельзя без почтового сервера, поэтому код показан здесь.</span></div><input id="cd" inputmode="numeric" maxlength="6" placeholder="000000"><button class="btn" data-a="verify">Войти</button>`;
 if(step===2)c.innerHTML=`<h3>Создайте профиль</h3><input id="nn" placeholder="Имя" maxlength="30"><input id="un" placeholder="username (латиница)" maxlength="20"><button class="btn" data-a="reg">Создать аккаунт</button>`}
/* ---- render ---- */
function rList(){const f=$('#q').value.trim().replace(/^@/,'').toLowerCase(),h=[];
 if(f){Object.entries(U).filter(([i,u])=>i!==uid&&(u.un.includes(f)||u.name.toLowerCase().includes(f))).forEach(([i,u])=>h.push(`<div class="row" data-a="dm" data-i="${esc(i)}">${av(u)}<div class="in"><div class="n">${nm(u)}</div><div class="lm">@${esc(u.un)}</div></div></div>`));
  $('#list').innerHTML=h.join('')||'<p class="sm" style="padding:16px">Никого не найдено</p>';return}
 chats().forEach(([c,m])=>{const g=c==='general',p=g?null:peer(c),last=M.filter(x=>x.c===c).pop();
  h.push(`<div class="row ${c===chat?'on':''}" data-a="open" data-i="${esc(c)}">${g?'<span class="av"><b>💬</b></span>':av(p)}<div class="in"><div class="n">${g?'Mell General':nm(p)}</div><div class="lm">${last?esc((U[last.f]?.name||'')+': '+last.tx):'Нет сообщений'}</div></div><span class="sm">${last?tm(last.t):''}</span></div>`)});
 $('#list').innerHTML=h.join('')}
function rHead(){const g=chat==='general',p=g?null:peer(chat);
 $('#head').innerHTML=`<button class="btn s" data-a="back" style="display:${innerWidth<=720?'block':'none'}">←</button>`+(g?'<span class="av"><b>💬</b></span><div><b>Mell General</b><div class="sm">общий чат · '+Object.keys(U).length+' уч.</div></div>':`<span data-a="prof" data-i="${esc(p?.id||'')}">${av(p)}</span><div><b>${nm(p)}</b><div class="sm">${p?.ch?(p.ch.k==='c'?'канал':'группа')+' · '+p.ch.mem.length+' уч.':'@'+esc(p?.un||'')}</div></div>${p&&!p.ch&&!p.bot?'<span style="margin-left:auto;display:flex;gap:6px"><button class="btn s" data-a="call" data-v="0">📞</button><button class="btn s" data-a="call" data-v="1">🎥</button></span>':''}`)}
function rMsgs(){if(chat===BC())return botPanel();const el=$('#msgs'),b=el.scrollHeight-el.scrollTop-el.clientHeight<80,g=chat==='general'||!!U[chat]?.ch;
