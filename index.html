<style>
:root{--bg:#000;--p:#0c0c0e;--p2:#161618;--l:#26262a;--t:#f2f2f2;--m:#8b8b93;--a:#2f8fff;--own:#1f5fbf;--g:linear-gradient(135deg,#ffd76a,#ff8f3a,#ff4fa3)}

/* auth */

#app{height:100%;display:grid;grid-template-columns:340px 1fr}

.m{max-width:min(78%,520px);align-self:flex-start;background:var(--p2);border-radius:16px 16px 16px 4px;padding:7px 11px;position:relative}
.m.me{align-self:flex-end;background:var(--own);border-radius:16px 16px 4px 16px}

.m .tm{font-size:11px;color:#ffffff90;text-align:right;margin-top:1px}

.m:hover .act,.m:focus-within .act{display:flex}.act button{padding:2px 5px;font-size:14px}
#bar{padding:10px;background:var(--p);border-top:1px solid var(--l)}

#emo{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--p2);border-radius:12px;padding:6px;margin-bottom:8px}
#emo button{font-size:20px;padding:3px}
/* avatars & frames */
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;display:inline-grid;place-items:center;isolation:isolate;background:linear-gradient(135deg,#3a3a46,#1a1a22);vertical-align:middle}

.f-gold{box-shadow:0 0 0 2px #000,0 0 0 4px #ffc93c}
.f-neon{box-shadow:0 0 0 2px #000,0 0 0 4px #20f0ff,0 0 14px #20f0ff}
.f-rose{box-shadow:0 0 0 2px #000,0 0 0 4px #ff4fa3,0 0 14px #ff4fa388}
.f-rainbow::before,.f-fire::before{content:"";position:absolute;inset:-5px;border-radius:50%;z-index:-1;background:conic-gradient(#f33,#fa0,#ff0,#3f6,#0cf,#93f,#f33);animation:rot 3s linear infinite;-webkit-mask:radial-gradient(circle,transparent calc(50% - 1px),#000 calc(50% - 0px));mask:radial-gradient(circle,transparent calc(50% - 1px),#000 calc(50% - 0px))}
.f-rainbow::after,.f-fire::after{content:"";position:absolute;inset:-3px;border-radius:50%;z-index:-1;background:#000}
.f-fire::before{background:conic-gradient(#ff2a00,#ffb300,#ff2a00,#ffb300,#ff2a00);animation-duration:1.2s}
@keyframes rot{to{transform:rotate(1turn)}}

.stt{display:inline-block;margin-left:3px;font-size:1.05em}.stt img{height:1.3em;vertical-align:middle}
.an-bounce{animation:bn 1s infinite}.an-spin{animation:rot 2s linear infinite}.an-pulse{animation:pl 1.2s infinite}.an-shake{animation:sh .6s infinite}
@keyframes bn{50%{transform:translateY(-3px)}}@keyframes pl{50%{transform:scale(1.3)}}@keyframes sh{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
/* modal */
#mod{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:12px;z-index:9}

.box>*:not(.ban){margin:0 16px}.ban{height:120px;background:linear-gradient(135deg,#1b2a4a,#3a1b4a);background-size:cover;background-position:center;border-radius:20px 20px 0 0;position:relative}

.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:5px 9px}.chips button.on{border-color:var(--a)}
.lock{opacity:.5;pointer-events:none}.lbl{font-size:12px;color:var(--m);margin-top:4px}
@media(max-width:720px){#app{grid-template-columns:1fr}#main{display:none}#app.chat #side{display:none}#app.chat #main{display:flex}.m{max-width:88%}}
/* GLASS */
body{background:#030308}body::before,body::after{content:'';position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.55;z-index:-1;animation:orb 18s ease-in-out infinite alternate}

@keyframes orb{to{transform:translate(12vmax,8vmax) scale(1.2)}}
:root{--p:rgba(255,255,255,.06);--p2:rgba(255,255,255,.09);--l:rgba(255,255,255,.16)}

.big{font-size:84px;line-height:1.1;display:inline-block}.sk{width:150px;max-width:100%}.ce{height:1.4em;vertical-align:middle}

/* ===== v2: чёрно-белый интерфейс, но цветные аватары/баннеры/рамки/ники/стикеры/эмодзи ===== */
:root{--a:#e6e6e6}
body{background:#050505}
#main{background:linear-gradient(120deg,#ffffff0d,#ffffff00,#ffffff14,#ffffff0d);background-size:300% 300%;animation:aur 14s ease infinite}

/* --- разрешения (микрофон, камера, геолокация) --- */
const isApp=()=>{try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true||!!(window.Capacitor||window.ReactNativeWebView||window.flutter_inappwebview||window.cordova)||/; wv\)|Median|GoNative|MellApp|Capacitor/i.test(navigator.userAgent)}catch(e){return false}};
const pst=async n=>{try{return(await navigator.permissions.query({name:n})).state}catch(e){return'?'}};
async function permUI(){const m=$('#mod');m.classList.remove('hide');const r=await Promise.all(['microphone','camera','geolocation'].map(pst)),ic=s=>s==='granted'?'✅':s==='denied'?'⛔':'⚪';
 m.innerHTML=`<div class="box" style="padding:16px 0"><b>🔐 Разрешения приложения</b><p class="sm">Mell chat нужен доступ, чтобы работали голосовые, звонки и карта друзей.</p><div>${ic(r[0])} Микрофон — голосовые и звонки</div><div>${ic(r[1])} Камера — видеозвонки</div><div>${ic(r[2])} Геолокация — карта друзей (отключается в профиле)</div>${r.includes('denied')?'<p class="sm">⛔ Запрещённое включается в настройках телефона/браузера для этого приложения.</p>':''}<button class="btn" data-a="permgo">Разрешить</button><button class="btn s" data-a="permx">Позже</button></div>`}
A.perm=()=>permUI();
A.permx=()=>{LS.set('mell_perm','1');A.close()};
A.permgo=async()=>{LS.set('mell_perm','1');const md=navigator.mediaDevices;
 if(md&&md.getUserMedia){try{const s=await md.getUserMedia({audio:true,video:true});s.getTracks().forEach(t=>t.stop())}catch(e){try{const s=await md.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}catch(e2){}}}else toast('Нужен https');
 if(navigator.geolocation)await new Promise(ok=>navigator.geolocation.getCurrentPosition(p=>{if(U[uid]?.geoOn!==false)pushGeo(p);ok()},ok,{timeout:20000}));
 geoSync();permUI()};

/* --- геолокация --- */
let wid=null,lastG=null;
const geoWant=()=>{const u=U[uid];return!!(u&&u.geoOn!==false&&navigator.geolocation)};
function geoSync(){if(!U[uid])return;if(!geoWant()){if(wid!=null){navigator.geolocation.clearWatch(wid);wid=null;lastG=null}return}
 if(wid==null)pst('geolocation').then(s=>{if(s==='granted')startGeo()})}
function startGeo(){if(wid!=null||!geoWant())return;wid=navigator.geolocation.watchPosition(pushGeo,()=>{},{enableHighAccuracy:false,maximumAge:60000,timeout:30000})}
function pushGeo(p){if(!geoWant())return;const k=10**GEO_PREC,a=Math.round(p.coords.latitude*k)/k,o=Math.round(p.coords.longitude*k)/k,n=Date.now();
 if(lastG&&(n-lastG.t<120000||(lastG.a===a&&lastG.o===o&&n-lastG.t<600000)))return;lastG={a,o,t:n};upd('users',uid,{gl:{a,o,t:n}})}

/* --- карта друзей (Google Maps) --- */
const friends=()=>Object.values(U).filter(u=>!u.ch&&!u.bot&&u.id!==uid&&(U[uid]?.ct||[]).includes(u.id)&&(u.ct||[]).includes(uid));
const pts=()=>[U[uid],...friends()].filter(u=>u&&u.geoOn!==false&&u.gl&&Date.now()-u.gl.t<7*864e5);
const ago=t=>{const s=(Date.now()-t)/1000;return s<90?'только что':s<3600?Math.round(s/60)+' мин назад':s<86400?Math.round(s/3600)+' ч назад':Math.round(s/86400)+' д назад'};
const DARKMAP=[{elementType:'geometry',stylers:[{color:'#1d1d27'}]},{elementType:'labels.text.fill',stylers:[{color:'#9a9aa8'}]},{elementType:'labels.text.stroke',stylers:[{color:'#14141c'}]},{featureType:'road',elementType:'geometry',stylers:[{color:'#2f2f3d'}]},{featureType:'water',elementType:'geometry',stylers:[{color:'#0c1224'}]},{featureType:'poi',stylers:[{visibility:'off'}]}];
let gm=null,gmk={},gmP=null,fb=null;
function loadGM(){if(window.google&&google.maps)return Promise.resolve();return gmP||(gmP=new Promise((ok,no)=>{window.__gmok=ok;window.gm_authFailure=()=>{const e=$('#gmap');if(e)e.innerHTML='<p class="sm" style="padding:16px">Google Maps отклонил ключ API — проверьте ключ и разрешённые домены.</p>'};
 const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(MELL.gmapsKey)+'&callback=__gmok';s.async=true;s.onerror=()=>{gmP=null;no(new Error('gm'))};document.head.append(s)}))}
function mkIcon(u){return new Promise(ok=>{const s=96,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),ring=()=>{x.lineWidth=7;x.strokeStyle='#fff';x.beginPath();x.arc(s/2,s/2,s/2-3.5,0,7);x.stroke();ok(c.toDataURL())},
  ltr=()=>{const h=hue(u.name);x.fillStyle=`hsl(${h} 65% 45%)`;x.beginPath();x.arc(s/2,s/2,s/2-3,0,7);x.fill();x.fillStyle='#fff';x.font='bold 44px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText((u.name||'?')[0].toUpperCase(),s/2,s/2+3);ring()},i=img(u.av);
  if(!i)return ltr();const im=new Image();im.onload=()=>{x.save();x.beginPath();x.arc(s/2,s/2,s/2-3,0,7);x.clip();const k=Math.max(s/im.width,s/im.height);x.drawImage(im,(s-im.width*k)/2,(s-im.height*k)/2,im.width*k,im.height*k);x.restore();ring()};im.onerror=ltr;im.src=i})}
function upMarkers(fit){if(!gm||!window.google)return;const P=pts(),ids=new Set(P.map(u=>u.id));
 Object.keys(gmk).forEach(i=>{if(!ids.has(i)){gmk[i].m.setMap(null);delete gmk[i]}});
 P.forEach(u=>{const pos={lat:u.gl.a,lng:u.gl.o},k=gmk[u.id],sig=(u.av||'').length+u.name;
  if(k){k.m.setPosition(pos);if(k.sig!==sig){k.sig=sig;mkIcon(u).then(url=>k.m.setIcon({url,scaledSize:new google.maps.Size(48,48),anchor:new google.maps.Point(24,24)}))}}
  else{const m=new google.maps.Marker({map:gm,position:pos,title:u.name,optimized:false});gmk[u.id]={m,sig};mkIcon(u).then(url=>m.setIcon({url,scaledSize:new google.maps.Size(48,48),anchor:new google.maps.Point(24,24)}))}});
 if(fit&&P.length){const b=new google.maps.LatLngBounds();P.forEach(u=>b.extend({lat:u.gl.a,lng:u.gl.o}));gm.fitBounds(b,60);google.maps.event.addListenerOnce(gm,'idle',()=>{if(gm.getZoom()>15)gm.setZoom(15)})}}
function flist(){const l=$('#fl');if(!l)return;const F=[U[uid],...friends()].filter(Boolean);
 l.innerHTML=F.map(u=>{const on=u.geoOn!==false&&u.gl&&Date.now()-u.gl.t<7*864e5;return`<div class="fr" data-a="fpan" data-i="${esc(u.id)}">${av(u,36)}<div class="in"><div class="n">${nm(u)}${u.id===uid?' (вы)':''}</div><div class="sm">${on?'📍 '+ago(u.gl.t):u.geoOn===false?'🙈 скрыл геолокацию':'нет данных'}</div></div></div>`}).join('')||'<p class="sm" style="padding:8px">Друзей пока нет. Друг — тот, кого вы добавили в чаты и кто добавил вас.</p>'}
A.fpan=(_,e)=>{const u=U[e.dataset.i];if(!u||!u.gl||u.geoOn===false)return toast('Нет геолокации');
 if(gm)gm.panTo({lat:u.gl.a,lng:u.gl.o}),gm.setZoom(16);else if(fb)fb.src=`https://www.google.com/maps?q=${u.gl.a},${u.gl.o}&z=16&output=embed`};
A.map=()=>{const m=$('#mod'),me=U[uid]||{};m.classList.remove('hide');gm=null;gmk={};
 m.innerHTML=`<div class="box wide" style="padding:16px 0"><b>🗺 Друзья на карте</b><div class="sm">Друг — тот, кого вы добавили в чаты и кто добавил вас. Координаты округлены (~${Math.round(111000/10**GEO_PREC)} м).</div><div id="gmap"></div><label class="ph" style="gap:8px"><input type="checkbox" id="mgeo" style="width:auto" ${me.geoOn!==false?'checked':''}><span>📍 Показывать меня друзьям</span></label><div id="fl"></div><button class="btn s" data-a="close">Закрыть</button></div>`;
 flist();if(me.geoOn!==false)startGeo();
 const P=pts(),el=$('#gmap');
 if(!MELL.gmapsKey){const f=P[0];el.innerHTML=f?`<iframe id="gmf" src="https://www.google.com/maps?q=${f.gl.a},${f.gl.o}&z=15&output=embed" style="width:100%;height:100%;border:0" loading="lazy" allow="geolocation"></iframe>`:'<p class="sm" style="padding:16px">Пока никто не делится геолокацией.</p>';fb=$('#gmf');return}
 loadGM().then(()=>{const e=$('#gmap');if(!e)return;gm=new google.maps.Map(e,{center:{lat:P[0]?.gl.a??55.75,lng:P[0]?.gl.o??37.62},zoom:P.length?13:4,disableDefaultUI:true,zoomControl:true,styles:DARKMAP,gestureHandling:'greedy'});upMarkers(true)}).catch(()=>{el.innerHTML='<p class="sm" style="padding:16px">Не удалось загрузить Google Maps.</p>'})};
document.addEventListener('change',ev=>{if(ev.target.id!=='mgeo')return;const on=ev.target.checked;upd('users',uid,on?{geoOn:true}:{geoOn:false,gl:null});if(on)setTimeout(startGeo,200);else lastG=null});

/* --- кастомные обои чатов (хранятся на устройстве) --- */
const WPP=['#0b1020','#101010','#1a1033','#0d2b2b','#2b0d1a','linear-gradient(160deg,#1b2a4a,#3a1b4a)','linear-gradient(160deg,#0f2027,#2c5364)','linear-gradient(160deg,#42275a,#734b6d)','linear-gradient(160deg,#141e30,#243b55)','linear-gradient(160deg,#3a1c12,#7a3b2e)','linear-gradient(160deg,#134e5e,#71b280)','repeating-linear-gradient(45deg,#15151a 0 14px,#1b1b22 14px 28px)'];
let WP={g:null,c:{}},wpK='#',wpScope='c';
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('mell',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function wpLoad(){try{const d=await idb(),g=d.transaction('kv').objectStore('kv').get('wp:'+uid);WP=await new Promise(ok=>{g.onsuccess=()=>ok(g.result||{});g.onerror=()=>ok({})})}catch(e){try{WP=JSON.parse(LS.get('mell_wp:'+uid)||'{}')}catch(e2){WP={}}}
 WP.c=WP.c||{};WP.g=WP.g||null;applyWp(1)}
async function wpSave(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(WP,'wp:'+uid)}catch(e){LS.set('mell_wp:'+uid,JSON.stringify(WP))}}
const wpCfg=c=>WP.c[c]||WP.g||null;
function applyWp(f){const l=$('#wpl'),d=$('#wpd');if(!l)return;const c=wpCfg(chat),k=c?[c.id,c.b,c.d].join('|'):'';if(k===wpK&&!f)return;wpK=k;
 if(!c){l.classList.remove('on');l.style.cssText='';d.style.opacity=0;return}
 l.classList.add('on');l.style.background=c.t==='img'?`center/cover no-repeat url("${c.v}")`:c.v;l.style.filter=c.b?`blur(${c.b}px)`:'';d.style.opacity=(c.d||0)/100}
function wpSet(fn){const t=(wpScope==='g'?WP.g:WP.c[chat])||{...(wpCfg(chat)||{t:'col',v:'#0b1020',b:0,d:0})};fn(t);t.id=Date.now();if(wpScope==='g')WP.g=t;else WP.c[chat]=t;wpSave();applyWp(1)}
function wpUI(){const m=$('#mod'),c=wpCfg(chat)||{};m.classList.remove('hide');
 m.innerHTML=`<div class="box" style="padding:16px 0"><b>🖼 Обои чата</b><div class="chips"><button class="${wpScope==='c'?'on':''}" data-a="wps" data-v="c">Только этот чат</button><button class="${wpScope==='g'?'on':''}" data-a="wps" data-v="g">Все чаты</button></div>
 <div class="lbl">Цвета и градиенты</div><div class="wps">${WPP.map((v,i)=>`<button style="background:${v}" class="${c.t==='col'&&c.v===v?'on':''}" data-a="wpp" data-i="${i}"></button>`).join('')}</div>
 <div class="lbl">Своё фото (хранится на этом устройстве)</div><input type="file" id="fwp" accept="image/*">
 <div class="lbl">Затемнение: <span id="wdv">${c.d||0}</span>%</div><input type="range" id="wd" min="0" max="85" value="${c.d||0}">
 <div class="lbl">Размытие: <span id="wbv">${c.b||0}</span> px</div><input type="range" id="wb" min="0" max="20" value="${c.b||0}">
 <button class="btn s" data-a="wpr">Сбросить обои</button><button class="btn" data-a="close">Готово</button></div>`}
A.wp=()=>wpUI();
A.wps=(_,e)=>{wpScope=e.dataset.v;wpUI()};
A.wpp=(_,e)=>{const v=WPP[+e.dataset.i];wpSet(t=>{t.t='col';t.v=v});wpUI()};
A.wpr=()=>{if(wpScope==='g')WP.g=null;else delete WP.c[chat];wpSave();applyWp(1);wpUI()};
document.addEventListener('input',ev=>{const t=ev.target;if(t.id!=='wd'&&t.id!=='wb')return;if(!wpCfg(chat)){t.value=0;return toast('Сначала выберите обои')}
 const v=+t.value;$(t.id==='wd'?'#wdv':'#wbv').textContent=v;wpSet(c=>{c[t.id==='wd'?'d':'b']=v})});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id!=='fwp'||!t.files[0])return;const f=t.files[0];t.value='';if(f.size>12e6)return toast('Файл слишком большой (макс. 12 МБ)');
 rd(f,u=>{const i=new Image();i.onerror=()=>toast('Не удалось прочитать картинку');i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  const r=c.toDataURL('image/jpeg',.78);wpSet(w=>{w.t='img';w.v=r;w.d=w.d||25;w.b=w.b||0});toast('Обои установлены ✓');wpUI()};i.src=u})});

 if(!mr)return;if(ev.target.closest('.act')){mr.classList.remove('sel');return}if(ev.target.closest('audio,video,a,img,.who,.avs'))return;mr.classList.toggle('sel')});
boot();
